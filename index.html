<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>El Viejo Lobo – Brochetas</title>

  <!-- Google Fonts: Cinzel para encabezados, Inter para cuerpo -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

  <style>
    :root {
      --red:    #cc1f1f;
      --red-2:  #e02020;
      --gold:   #c9a84c;
      --dark:   #0a0a0a;
      --card:   #111111;
      --border: #2a2a2a;
      --text:   #e8e0d5;
      --muted:  #7a7068;
      --wa:     #25D366;
      --wa-h:   #1ebe5d;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background: var(--dark);
      background-image:
        radial-gradient(ellipse 80% 60% at 50% -10%, rgba(204,31,31,0.18) 0%, transparent 70%),
        url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.02'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', sans-serif;
      color: var(--text);
      padding: 32px 16px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-top: 3px solid var(--red);
      border-radius: 16px;
      padding: 48px 40px 40px;
      max-width: 460px;
      width: 100%;
      text-align: center;
      box-shadow:
        0 0 0 1px rgba(204,31,31,0.08),
        0 20px 60px rgba(0,0,0,0.7),
        0 0 80px rgba(204,31,31,0.06);
      position: relative;
      overflow: hidden;
    }

    .card::before,
    .card::after {
      content: '';
      position: absolute;
      width: 60px;
      height: 60px;
      border-color: var(--red);
      border-style: solid;
      opacity: 0.3;
    }
    .card::before {
      top: 12px; left: 12px;
      border-width: 2px 0 0 2px;
      border-radius: 4px 0 0 0;
    }
    .card::after {
      bottom: 12px; right: 12px;
      border-width: 0 2px 2px 0;
      border-radius: 0 0 4px 0;
    }

    .logo-wrap { margin-bottom: 20px; }

    .logo-wrap img {
      width: 160px;
      height: 160px;
      object-fit: contain;
      filter: drop-shadow(0 0 18px rgba(204,31,31,0.5));
      transition: filter 0.3s;
    }
    .logo-wrap img:hover {
      filter: drop-shadow(0 0 28px rgba(204,31,31,0.75));
    }

    .logo-fallback {
      display: none;
      width: 120px;
      height: 120px;
      margin: 0 auto;
      background: radial-gradient(circle, #1a0000, #0a0a0a);
      border: 2px solid var(--red);
      border-radius: 50%;
      align-items: center;
      justify-content: center;
      font-family: 'Cinzel', serif;
      font-size: 2.4rem;
      color: var(--red);
      font-weight: 900;
      text-shadow: 0 0 20px rgba(204,31,31,0.8);
    }

    .brand-name {
      font-family: 'Cinzel', serif;
      font-size: 2rem;
      font-weight: 900;
      color: var(--red);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      text-shadow:
        0 0 20px rgba(204,31,31,0.5),
        0 2px 4px rgba(0,0,0,0.8);
      line-height: 1.1;
      margin-bottom: 4px;
    }

    .brand-sub {
      font-family: 'Cinzel', serif;
      font-size: 0.75rem;
      letter-spacing: 0.35em;
      color: var(--gold);
      text-transform: uppercase;
      margin-bottom: 28px;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 0 auto 28px;
      max-width: 280px;
    }
    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(to right, transparent, var(--border), transparent);
    }
    .divider span {
      font-size: 1rem;
      color: var(--red);
      opacity: 0.7;
    }

    .description {
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.7;
      margin-bottom: 36px;
      padding: 0 8px;
    }

    .btn-whatsapp {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: var(--wa);
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      font-family: 'Inter', sans-serif;
      text-decoration: none;
      padding: 15px 36px;
      border-radius: 50px;
      transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
      box-shadow: 0 4px 20px rgba(37,211,102,0.3);
      letter-spacing: 0.02em;
    }

    .btn-whatsapp:hover {
      background: var(--wa-h);
      transform: translateY(-2px);
      box-shadow: 0 6px 28px rgba(37,211,102,0.5), 0 0 0 4px rgba(37,211,102,0.1);
    }

    .btn-whatsapp:active { transform: translateY(0); }

    .btn-whatsapp svg {
      width: 20px;
      height: 20px;
      fill: #fff;
      flex-shrink: 0;
    }

    footer {
      margin-top: 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .footer-tagline {
      font-family: 'Cinzel', serif;
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      color: var(--muted);
      text-transform: uppercase;
    }

    .footer-copy {
      font-size: 0.72rem;
      color: #3a3530;
    }

    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.92);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 16px;
      backdrop-filter: blur(4px);
    }

    .modal-overlay.open { display: flex; }

    .modal-inner {
      position: relative;
      max-width: 680px;
      width: 100%;
      animation: modalIn 0.25s ease;
    }

    @keyframes modalIn {
      from { opacity: 0; transform: scale(0.92) translateY(16px); }
      to   { opacity: 1; transform: scale(1)   translateY(0); }
    }

    .modal-inner img {
      width: 100%;
      border-radius: 12px;
      box-shadow: 0 20px 80px rgba(0,0,0,0.8);
      display: block;
    }

    .modal-close {
      position: absolute;
      top: -14px;
      right: -14px;
      width: 36px;
      height: 36px;
      background: var(--red);
      color: #fff;
      border: none;
      border-radius: 50%;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, transform 0.15s;
      box-shadow: 0 4px 12px rgba(204,31,31,0.5);
    }

    .modal-close:hover {
      background: #e02020;
      transform: scale(1.1);
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 14px;
      align-items: center;
    }

    .btn-menu {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: transparent;
      color: var(--gold);
      cursor: pointer;
      font-size: 1rem;
      font-weight: 600;
      font-family: 'Inter', sans-serif;
      text-decoration: none;
      padding: 14px 36px;
      border-radius: 50px;
      border: 2px solid var(--gold);
      transition: background 0.2s, transform 0.15s, box-shadow 0.2s, color 0.2s;
      letter-spacing: 0.04em;
    }

    .btn-menu:hover {
      background: var(--gold);
      color: #0a0a0a;
      transform: translateY(-2px);
      box-shadow: 0 6px 28px rgba(201,168,76,0.4);
    }

    .btn-menu:active { transform: translateY(0); }

    .btn-menu svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
      flex-shrink: 0;
    }

    @media (max-width: 480px) {
      .card { padding: 36px 24px 32px; }
      .brand-name { font-size: 1.6rem; }
      .logo-wrap img { width: 130px; height: 130px; }
      .btn-whatsapp, .btn-menu { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="card">

    <div class="logo-wrap">
      <img
        src="logo.png"
        alt="El Viejo Lobo"
        onerror="this.style.display='none'; document.querySelector('.logo-fallback').style.display='flex';"
      />
      <div class="logo-fallback">🐺</div>
    </div>

    <h1 class="brand-name">El Viejo Lobo</h1>
    <p class="brand-sub">Brochetas</p>

    <div class="divider"><span>✦</span></div>

    <p class="description">
      ¿Listo para probar las mejores brochetas de la ciudad?<br />
      Escríbenos directamente por WhatsApp y haz tu pedido.
    </p>

    <div class="btn-group">
      <a
        class="btn-whatsapp"
        href="https://wa.me/526183252833?text=Hola%2C%20me%20gustar%C3%ADa%20hacer%20un%20pedido%20%F0%9F%94%A5"
        target="_blank"
        rel="noopener noreferrer"
      >
        <svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
          <path d="M16 2C8.268 2 2 8.268 2 16c0 2.44.65 4.73 1.788 6.71L2 30l7.49-1.763A13.93 13.93 0 0016 30c7.732 0 14-6.268 14-14S23.732 2 16 2zm0 25.6a11.56 11.56 0 01-5.88-1.602l-.42-.25-4.446 1.045 1.065-4.33-.273-.44A11.527 11.527 0 014.4 16C4.4 9.588 9.588 4.4 16 4.4S27.6 9.588 27.6 16 22.412 27.6 16 27.6zm6.34-8.64c-.347-.174-2.054-1.014-2.373-1.13-.32-.116-.552-.174-.784.174-.232.347-.9 1.13-1.103 1.362-.203.232-.406.26-.753.087-.347-.174-1.466-.54-2.793-1.722-1.032-.92-1.73-2.055-1.933-2.402-.203-.347-.022-.535.153-.708.157-.155.347-.405.52-.608.174-.203.232-.347.347-.579.116-.232.058-.434-.029-.608-.087-.174-.784-1.89-1.074-2.588-.283-.68-.57-.588-.784-.598l-.668-.012c-.232 0-.608.087-.927.434-.32.347-1.218 1.19-1.218 2.9s1.247 3.365 1.42 3.597c.174.232 2.454 3.746 5.944 5.252.831.359 1.48.573 1.986.733.834.265 1.594.228 2.194.138.669-.1 2.054-.84 2.344-1.652.29-.812.29-1.508.203-1.652-.087-.145-.32-.232-.667-.406z"/>
        </svg>
        Hacer mi pedido
      </a>

      <button class="btn-menu" onclick="document.getElementById('menuModal').classList.add('open')">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M6 2a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6H6zm0 2h7v5h5v11H6V4zm2 8v2h8v-2H8zm0 4v2h5v-2H8z"/>
        </svg>
        Ver menú completo
      </button>
    </div>

    <footer>
      <span class="footer-tagline">El sabor que muerde de vuelta</span>
      <span class="footer-copy">© 2026 El Viejo Lobo · Brochetas</span>
    </footer>
  </div>

  <!-- Modal menú -->
  <div id="menuModal" class="modal-overlay" onclick="if(event.target===this)this.classList.remove('open')">
    <div class="modal-inner">
      <button class="modal-close" onclick="document.getElementById('menuModal').classList.remove('open')" aria-label="Cerrar">&#x2715;</button>
      <img src="menu.jpg" alt="Menú El Viejo Lobo" onerror="this.src='menu.png'" />
    </div>
  </div>

  <script>
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') document.getElementById('menuModal').classList.remove('open');
    });
  </script>
</body>
</html>
